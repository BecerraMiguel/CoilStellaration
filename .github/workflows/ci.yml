name: CI

# Runs on every push to main, on every pull request, and on demand (Actions tab).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels a run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast: formatting, lint and file hygiene. Does not build the Python environment.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Same hooks as the local git hook (.pre-commit-config.yaml). Keep the version in
      # step with uv.lock.
      - name: Run pre-commit
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

  # Full environment (JAX, DESC, upstream) and the test suites. GitHub runners have AVX.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # booz-xform (via constellaration) has no wheel and builds from source.
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libnetcdf-dev ninja-build pkg-config

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Our tests
        run: uv run --locked pytest tests/ --durations=10

      # Cheap upstream test that pins the benchmark scoring we optimise against.
      - name: Upstream scoring tests
        run: >
          uv run --locked pytest
          external/coilstellaration/src/coilstellaration/benchmark/scoring_test.py
